[package]
name = "libmorph"
version = "0.4.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Unified windowing, graphics and device-emulation shell for wgpu applications"
repository = "https://github.com/tmzt/libmorph"
# Not a native library: `links` lets build.rs republish libmobile's Gradle
# handoff to the app's build script as `DEP_LIBMORPH_*`, so the app reads it
# with `libmobile::gradle::Project::env_prefix("libmorph")`.
links = "libmorph"
build = "build.rs"

[workspace]
members = [".", "crates/libmorph-build", "examples/android/audiocapture", "examples/android/securestore", "examples/android/urlopen", "examples/android/background"]

[features]
default = ["audio"]
# cpal on desktop and the web; on Android, libmobile's copy (its `cpal`
# feature), so cpal stays optional in both crates.
audio = ["dep:cpal", "libmobile?/cpal"]
# The cpal re-export (`libmorph::cpal`) and the output device it opened.
audio-cpal = ["audio"]
mobile = ["dep:libmobile"]
# Passthrough: each one also enables `mobile`, so `libmobile/<x>` is never
# requested without the dependency itself.
mobile-google-auth = ["mobile", "libmobile/google-auth"]
mobile-camera = ["mobile", "libmobile/camera"]
# The secure store's Keystore key in the TEE only, never StrongBox. Negative,
# so turning off default features cannot turn off StrongBox; apps only.
mobile-secure-store-no-strongbox = ["mobile", "libmobile/secure-store-no-strongbox"]
# A foreground service with its notification (`libmorph::service`) and
# its events (`MorphApp::on_service`).
mobile-foreground-service = ["mobile", "libmobile/foreground-service"]
# libmobile's system events for `libmorph::system_events`: visibility,
# focus, the service, the network and Doze.
mobile-system-events = ["mobile", "libmobile/system-events"]
# Battery optimization and app sleeping (`libmorph::battery`).
mobile-battery = ["mobile", "libmobile/battery"]
# `system_events::subscribe_tokio`: libmobile's on Android, and libmorph's
# own desktop stream. No tokio runtime is needed to send.
tokio = ["libmobile?/tokio", "dep:tokio"]
web = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "wgpu/webgl",
    "cpal?/wasm-bindgen",
]
# Named secrets and adapter keys, encrypted at rest (`ctx.secure_store()`,
# `ctx.key_store()`): libmobile's Keystore stores on Android, libdevice's
# login Keychain on macOS.
secure-store = ["libdevice/secure-store"]
# Scripted headless runs with PNG screenshots (desktop only; enables
# nothing on Android and the web). Also libdevice's test-only memory vault,
# which scripted runs use for `ctx.key_store()`.
script = ["dep:png", "dep:crc32fast", "libdevice/test-vault"]

[dependencies]
libdevice = { git = "https://github.com/tmzt/libdevice" }
log = "0.4"
web-time = "1"
wgpu = "30.0.1"
# Its platform-free types (`SafeArea`, `Insets`) build on any host; the
# runtime is Android-only.
libmobile = { git = "https://github.com/tmzt/libmobile", optional = true }
# `system_events::subscribe_tokio` (feature `tokio`): an unbounded channel only.
tokio = { version = "1", default-features = false, features = ["sync"], optional = true }

# The host copy, for `libmobile::gradle::forward_metadata` in build.rs.
# `dep:libmobile` (the `mobile` feature) enables it with the normal one.
[build-dependencies]
libmobile = { git = "https://github.com/tmzt/libmobile", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30.13"
# On Android, cpal comes from libmobile (`libmobile::android::cpal`).
cpal = { version = "0.18.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
png = { version = "0.18.1", optional = true }
# png's own chunk CRC crate, named for the manifest's pixel CRC.
crc32fast = { version = "1.5", optional = true }

# Trackpad fingers from AppKit, at the versions winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
# `MorphContext::open_link`: libdevice's NSWorkspace opener, always on.
libdevice = { git = "https://github.com/tmzt/libdevice", features = ["open-link"] }
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSEnumerator", "NSGeometry", "NSSet"] }
objc2-app-kit = { version = "0.2.2", features = [
    "block2",
    "NSEvent",
    "NSResponder",
    "NSTouch",
    "NSView",
] }
block2 = "0.5.1"

[target.'cfg(target_os = "android")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
] }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dev-dependencies]
env_logger = "0.11"
# Test key adapters (tests/secure_store.rs).
zeroize = { version = "1.8", features = ["derive"] }

[[example]]
name = "touch"

[[example]]
name = "raymarch"

[[example]]
name = "tone"

[[example]]
name = "audiocapture"

[[example]]
name = "urlopen"

[[example]]
name = "securestore"
required-features = ["secure-store"]

[[example]]
name = "background"
