# repowiki.toml
# Read by repowiki's collector from the repository root.

# Landing page of the registered site.
default_route = "/README"

# Symlinked as static files, not listed in navigation. out/ is gitignored
# render output (scripted-run screenshots); its images resolve as ./out/...
static_dirs = ["out"]

[crate_resolution]
# Only these folders become navigation groups; docs/design/*.md is grouped
# as a "design" package, one entry per plan. crates/ holds libmorph-build,
# examples/ the examples and their Android crates.
prefixes = ["docs", "crates", "examples"]
