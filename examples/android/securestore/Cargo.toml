[package]
name = "libmorph-example-securestore-android"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The securestore example on Android, through libmobile's Keystore-sealed blobs"

[lib]
name = "securestore_android"
crate-type = ["lib", "cdylib"]

[features]
# The TEE-only variant, for the device check.
no-strongbox = ["libmorph/mobile-secure-store-no-strongbox"]

[dependencies]
libmorph = { path = "../../..", default-features = false }
log = "0.4"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
libmorph = { path = "../../..", default-features = false, features = ["mobile", "secure-store"] }

# Generates the Gradle project from libmorph's forwarded libmobile metadata.
[build-dependencies]
libmorph-build = { path = "../../../crates/libmorph-build" }
