[package]
name = "libmorph-build"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Build-script helpers for libmorph apps: Gradle project generation for Android"
repository = "https://github.com/tmzt/libmorph"

[dependencies]
# `icons`: gradle::Icon and Project::icon (host-only; this crate is a
# build-dependency).
libmobile = { git = "https://github.com/tmzt/libmobile", features = ["icons"] }
